<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Drug Detect AI — Smart Medicine Image Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --deep-outer: #043c3c;
      --deep-mid: #075d5d;
      --deep-center: #006666fe;
      --glass-border: rgba(255, 255, 255, 0);
      --muted: rgba(230,255,255,0.88);
      --accent: #cffefe;
      --card-radius: 18px;
      --card-pad: 34px;
      --response-max-h: 460px;
      --scrollbar-track: rgba(255,255,255,0.03);
      --scrollbar-thumb: rgba(175,245,242,0.22);
    }

    /* Prevent browser from trying to restore previous scroll position automatically */
    html { scroll-behavior: smooth; scroll-padding-top: 28px; scroll-behavior: smooth; }
    /* We'll set manual restoration in JS */

    html, body { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }

    html, body {
    min-height: 100%;
    margin: 0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    -webkit-font-smoothing: antialiased;
    background-attachment: fixed;
    overflow-x: hidden;
    }

    body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 28px 20px 60px;
    color: #e8fbfb;
    box-sizing: border-box;

      /* tuned background to match the reference image: strong center soft vignette */
      background:
        radial-gradient(800px 500px at 50% 12%, rgba(6,160,158,0.18), transparent 9%),
        radial-gradient(900px 700px at 30% 40%, rgba(12,200,200,0.08), transparent 12%),
        radial-gradient(900px 700px at 70% 80%, rgba(5,90,90,0.04), transparent 12%),
        linear-gradient(180deg, var(--deep-outer) 0%, var(--deep-mid) 45%, var(--deep-center) 100%);
    }

    /* === Background Enhancement === */
    .bg-subtle {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    overflow: hidden;
    filter: blur(120px);
    }

    .orb {
    position: absolute;
    border-radius: 50%;
    opacity: 0.25;
    mix-blend-mode: screen;
    animation: floatOrb 60s ease-in-out infinite alternate;
    }

    .orb-a {
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(0,255,255,0.3), transparent 60%);
    top: -120px; left: -100px;
    animation-delay: 0s;
    }

    .orb-b {
    width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(0,180,180,0.25), transparent 70%);
    bottom: -200px; right: -160px;
    animation-delay: 8s;
    }

    .orb-c {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 65%);
    top: 40%; left: 60%;
    animation-delay: 16s;
    }

    @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); opacity: 0.15; }
    25% { transform: translate(40px, -20px) scale(1.05); opacity: 0.22; }
    50% { transform: translate(-30px, 25px) scale(1.03); opacity: 0.2; }
    75% { transform: translate(20px, 35px) scale(1.04); opacity: 0.18; }
    100% { transform: translate(-40px, -30px) scale(1); opacity: 0.15; }
    }

    /* === Gentle Particle Shimmer Layer === */
    .particle-layer {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
    }

    .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: radial-gradient(circle, rgba(255,255,255,0.85) 0%, transparent 70%);
    border-radius: 50%;
    opacity: 0.25;
    animation: floatParticle 20s linear infinite;
    }

    @keyframes floatParticle {
    0% { transform: translateY(0) scale(1); opacity: 0.3; }
    25% { transform: translateY(-15px) scale(1.05); opacity: 0.35; }
    50% { transform: translateY(-30px) scale(0.95); opacity: 0.25; }
    75% { transform: translateY(-45px) scale(1.1); opacity: 0.4; }
    100% { transform: translateY(-60px) scale(1); opacity: 0.2; }
    }

    /* main stage */
    .stage{
      width:100%; max-width:820px; display:flex; flex-direction:column; gap:18px; align-items:center;
      margin:0 auto;
      flex-grow: 1;
    }

    header{text-align:center;margin-top:6px}
    h1{ font-family:Manrope, Inter, sans-serif; font-size:60px; margin:0; letter-spacing:-0.5px; color:#dffefe; font-weight:800; line-height:1; }
    p.lead{ margin:18px 0 0; color:var(--muted); font-size:20px; opacity:0.85; }


    /* main card */
    .card{
      width:100%;
      align-items:center;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:26px;
      padding:var(--card-pad);
      border:1px solid var(--glass-border);
      box-sizing:border-box;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 80px rgba(2,10,10,0.26);
    }

    .upload-plate {
    border-radius: 20px;
    padding: 46px 26px 40px;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.04));
    border: 1px solid rgba(255,255,255,0.03);
    text-align: center;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;   /* ✅ This ensures horizontal centering */
    gap: 14px;
    user-select: none;
    position: relative;
    }

    .upload-plate svg { width: 68px; height: 68px; color: rgba(220, 255, 255, 0.95); margin: 0 auto 8px; display: block;}
    .upload-title{ font-size:20px; font-weight:700; color:var(--muted); margin:0; }
    .upload-sub{ font-size:13px; color:rgba(235,255,255,0.9); opacity:0.95; margin-top:2px; }

    .analyze-row{ display:flex; gap:12px; justify-content:center; align-items:center; margin-top:18px; flex-wrap:wrap; }
    .analyze-btn{
      min-width:260px;
      background: linear-gradient(180deg, rgba(12,180,178,0.14), rgba(12,180,178,0.08));
      color:#eaffff;
      font-weight:800;
      border-radius:12px;
      padding:12px 18px;
      border: 1px solid rgba(255,255,255,0.04);
      cursor:pointer;
      font-size:16px;
      box-shadow:none;
    }
    .analyze-btn:active{ transform: translateY(1px); }
    .clear-btn{
      background: linear-gradient(180deg, rgba(12,180,178,0.14), rgba(12,180,178,0.03));
      color: rgba(230,255,255,0.94);
      border: 1px solid rgba(255,255,255,0.04);
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
      font-size:13px;
    }

    .stack{ display:flex; flex-direction:column; gap:18px; margin-top:20px; }

    .preview-card{
      display:flex;
      gap:18px;
      align-items:center;
      padding:16px;
      border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.04));
      border:1px solid rgba(255,255,255,0.03);
      min-height:100px;
    }

    .preview-thumb{
      width:140px;
      height:92px;
      border-radius:12px;
      object-fit:contain;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
    }

    .preview-meta{ display:flex; flex-direction:column; gap:6px; color: #dff; }
    .preview-meta .name{ font-weight:800; color:#f0fffe; font-size:16px; }
    .preview-meta .size{ font-size:13px; color: rgba(220,255,255,0.82); }

    /* response area: constrained and internally scrollable */
    .response-card{
      padding:18px;
      border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.03);
      min-height:120px;
      position:relative;
      display:flex;
      flex-direction:column;
    }
    .response-title{ font-weight:800; color:#eaffff; margin:0 0 8px 0; font-size:18px; }
    .response-body{
      color:#e9ffff; line-height:1.6; white-space:pre-wrap; font-size:15px;
      margin-top:6px;
      overflow:auto; max-height:var(--response-max-h); padding-right:8px;
    }

    .response-body::-webkit-scrollbar{ width:10px; height:10px; }
    .response-body::-webkit-scrollbar-track{ background: var(--scrollbar-track); border-radius:8px; }
    .response-body::-webkit-scrollbar-thumb{ background: var(--scrollbar-thumb); border-radius:8px; border:2px solid transparent; background-clip: padding-box; }

    .copy-btn{
      position:absolute; right:12px; top:12px;
      display:inline-flex; align-items:center; gap:8px;
      background: rgba(255,255,255,0.05);
      color: #eaffff;
      border-radius:10px; padding:8px 10px; border:1px solid rgba(255,255,255,0.03);
      font-size:13px; cursor:pointer; font-weight:700;
    }
    .copy-icon{ width:16px; height:16px; }

    .overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background: rgba(2,10,10,0.42); opacity:0; pointer-events:none; transition:opacity .12s ease; z-index:9999;}
    .overlay.show{ opacity:1; pointer-events:auto; }
    .spinner{ width:56px; height:56px; border-radius:50%; border:6px solid rgba(255,255,255,0.06); border-top-color: rgba(180,255,250,0.95); animation:spin 0.9s linear infinite; }
    @keyframes spin{ to { transform: rotate(360deg); } }

    @media (max-width:600px){
      h1{ font-size:34px; }
      .card{ padding:20px; border-radius:16px; }
      .preview-thumb{ width:110px; height:72px; }
      .analyze-btn{ width:100%; min-width:unset; }
      :root { --response-max-h: 260px; }
    }
  </style>
</head>
<body>
  <div class="bg-subtle" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
  </div>
  <div class="particle-layer" aria-hidden="true">
    <div class="particle" style="top:10%; left:20%; animation-delay: 0s;"></div>
    <div class="particle" style="top:40%; left:80%; animation-delay: 2s;"></div>
    <div class="particle" style="top:70%; left:60%; animation-delay: 4s;"></div>
    <div class="particle" style="top:30%; left:40%; animation-delay: 6s;"></div>
    <div class="particle" style="top:80%; left:10%; animation-delay: 8s;"></div>
    <div class="particle" style="top:50%; left:90%; animation-delay: 10s;"></div>
    <div class="particle" style="top:15%; left:65%; animation-delay: 12s;"></div>
  </div>

  <div class="stage" role="main" id="stage">
    <header>
      <h1>Drug Detect AI</h1>
      <p class="lead">Smart Medicine Image Analyzer</p>
    </header>

    <div class="card" role="region" aria-label="Upload area">
      <form id="mainForm" method="POST" enctype="multipart/form-data" novalidate>
        <div class="upload-plate" id="uploadPlate" aria-hidden="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" xmlns="http://www.w3.org/2000/svg"><path d="M12 16V8M12 8l-3 3M12 8l3 3M21 15v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/></svg>
          <div class="upload-title">Click or drag to upload</div>
          <div class="upload-sub">JPEG, PNG — clear photo of medicine</div>

          <input id="fileInput" name="file" type="file" accept="image/*" style="display:none;">

          <div class="analyze-row">
            <button type="submit" class="analyze-btn" id="analyzeBtn">Analyze Image</button>
            <button type="button" class="clear-btn" id="clearBtn">Clear Preview</button>
          </div>
        </div>

        <div class="stack" id="stackArea">
          <div class="preview-card" id="previewCard" style="display:none;">
            <img id="previewThumb" class="preview-thumb" src="" alt="preview"/>
            <div class="preview-meta">
              <div class="name" id="metaName">Filename.jpg</div>
              <div class="size" id="metaSize">24 KB</div>
            </div>
          </div>

          <div class="response-card" id="responseCard" style="display:none;">
            <div class="response-title">AI Response</div>
            <button class="copy-btn" id="copyBtn" type="button" aria-label="Copy result">
              <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" xmlns="http://www.w3.org/2000/svg"><path d="M8 7V3h11v11h-4M16 13H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8"/></svg>
              Copy
            </button>
            <div id="responseBody" class="response-body" tabindex="0">{{ response_text }}</div>
          </div>
        </div>
      </form>
    </div>

    <footer style="opacity:0.95; font-size:13px;">© 2025 Drug Detect AI</footer>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="spinner" role="status" aria-hidden="true"></div>
  </div>

  <script>
    // Keep scroll restoration manual so we control where to scroll
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

    const LS_KEY = 'drug_detect_preview_final_v2';
    const fileInput = document.getElementById('fileInput');
    const previewCard = document.getElementById('previewCard');
    const previewThumb = document.getElementById('previewThumb');
    const metaName = document.getElementById('metaName');
    const metaSize = document.getElementById('metaSize');
    const responseCard = document.getElementById('responseCard');
    const responseBody = document.getElementById('responseBody');
    const overlay = document.getElementById('overlay');
    const clearBtn = document.getElementById('clearBtn');
    const mainForm = document.getElementById('mainForm');
    const copyBtn = document.getElementById('copyBtn');
    const uploadPlate = document.getElementById('uploadPlate');
    const stackArea = document.getElementById('stackArea');

    // make plate clickable except when clicking buttons
    uploadPlate.addEventListener('click', (e) => {
      if (e.target.closest('.analyze-btn') || e.target.closest('.clear-btn') || e.target.closest('button')) return;
      fileInput.click();
    });

    // restore preview + show response if server returned text and preview exists
    function initFromSaved() {
      let saved = null;
      try { saved = localStorage.getItem(LS_KEY); } catch (e) { console.warn('localStorage read failed', e); }
      const serverText = responseBody && responseBody.textContent && responseBody.textContent.trim().length > 0;

      if (saved) {
        showPreviewFromDataURL(saved, true);
        // show server text only if both preview and server returned text
        if (serverText) {
          responseCard.style.display = 'block';
          // focus the response body (prevent scroll) then scroll into view
          requestAnimationFrame(() => {
            try { responseBody.focus({ preventScroll: true }); } catch {}
            setTimeout(() => {
              try { responseCard.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch {}
            }, 160);
          });
        }
      } else {
        hidePreview();
        responseCard.style.display = 'none';
      }

      // ensure overlay hidden
      overlay.classList.remove('show');
    }

    // On DOM ready
    window.addEventListener('DOMContentLoaded', initFromSaved);

    // file selection handler
    fileInput.addEventListener('change', (ev) => {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        try { localStorage.setItem(LS_KEY, dataUrl); } catch (err) { console.warn('localStorage save failed', err); }
        showPreviewFromDataURL(dataUrl, true, f);
        responseCard.style.display = 'none'; // hide previous server response until new response arrives
        // keep stacked area visible
        stackArea.style.display = 'flex';
      };
      reader.readAsDataURL(f);
    });

    // drag & drop handlers
    ['dragenter','dragover'].forEach(t => uploadPlate.addEventListener(t, (e)=>{ e.preventDefault(); }));
    ['dragleave','drop'].forEach(t => uploadPlate.addEventListener(t, (e)=>{ e.preventDefault(); }));
    uploadPlate.addEventListener('drop', (e) => {
      e.preventDefault();
      const dt = e.dataTransfer;
      if (dt && dt.files && dt.files.length) {
        const file = dt.files[0];
        const dtObj = new DataTransfer();
        dtObj.items.add(file);
        fileInput.files = dtObj.files;
        fileInput.dispatchEvent(new Event('change',{ bubbles:true }));
      }
    });

    // helper functions
    function showPreviewFromDataURL(dataUrl, show=true, file=null){
      previewThumb.src = dataUrl;
      metaName.textContent = file ? file.name : (metaName.textContent === 'No image uploaded' ? 'Uploaded image' : metaName.textContent);
      metaSize.textContent = file ? `${Math.round(file.size/1024)} KB • ${file.type || ''}` : metaSize.textContent || '';
      if (show) previewCard.style.display = 'flex';
      if (show) stackArea.style.display = 'flex';
    }
    function hidePreview(){
      previewCard.style.display = 'none';
      previewThumb.src = '';
      metaName.textContent = 'No image uploaded';
      metaSize.textContent = '';
    }

    // clear preview & hide response
    clearBtn.addEventListener('click', () => {
      try { localStorage.removeItem(LS_KEY); } catch(e) {}
      fileInput.value = '';
      hidePreview();
      responseCard.style.display = 'none';
      // smooth scroll back to upload plate so user remains in context
      setTimeout(()=> {
        try { document.querySelector('.card').scrollIntoView({ behavior:'smooth', block:'center' }); } catch {}
      }, 120);
    });

    // show overlay on submit only if file selected
    mainForm.addEventListener('submit', () => {
      if (fileInput.files && fileInput.files.length) overlay.classList.add('show');
    });

    // copy button (safe guards)
    if (copyBtn && responseBody) {
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(responseBody.textContent.trim());
          const prev = copyBtn.innerHTML;
          copyBtn.textContent = 'Copied';
          setTimeout(()=> { copyBtn.innerHTML = prev; }, 1200);
        } catch (err) {
          console.warn('clipboard failed', err);
          copyBtn.textContent = 'Failed';
          setTimeout(()=> { copyBtn.innerHTML = 'Copy'; }, 1200);
        }
      });
    }

    // after full load, if both preview and response exist, scroll into view smoothly
    window.addEventListener('load', () => {
      let saved = null;
      try { saved = localStorage.getItem(LS_KEY); } catch {}
      const serverText = responseBody && responseBody.textContent && responseBody.textContent.trim().length > 0;
      if (saved && serverText) {
        try { responseBody.focus({ preventScroll: true }); } catch {}
        setTimeout(()=> {
          try { responseCard.scrollIntoView({ behavior:'smooth', block:'center' }); } catch {}
          overlay.classList.remove('show');
        }, 180);
      } else {
        overlay.classList.remove('show');
      }
    });

    /* NOTES:
       - localStorage stores the image as a dataURL for preview persistence after reload.
         This is convenient but can use significant local storage for very large images.
         If you expect huge images, consider switching to server-side temporary storage or sessionStorage.
    */
  </script>
</body>
</html>
